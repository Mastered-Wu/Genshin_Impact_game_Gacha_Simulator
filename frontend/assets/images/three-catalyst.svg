<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0e8ff"/><stop offset="40%" stop-color="#8fc4f0"/><stop offset="78%" stop-color="#3a6fb0"/><stop offset="100%" stop-color="#2a4a80"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#e8f0ff"/><stop offset="60%" stop-color="#a0c0e8"/><stop offset="100%" stop-color="#5078a0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5078a0"/><stop offset="50%" stop-color="#3a5880"/><stop offset="100%" stop-color="#2a4860"/>
    </linearGradient>
    <linearGradient id="pages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f8e8"/><stop offset="100%" stop-color="#e0e0c8"/>
    </linearGradient>
    <clipPath id="diamond"><polygon points="256,36 476,256 256,476 36,256"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a1a38" flood-opacity="0.2"/></filter>
  </defs>
  <g filter="url(#sh)">
    <polygon points="256,28 484,256 256,484 28,256" fill="url(#rim)" stroke="#2a4a80" stroke-width="2"/>
    <g clip-path="url(#diamond)">
      <polygon points="256,36 476,256 256,476 36,256" fill="url(#bg)"/>
      <!-- floating spell book / catalyst -->
      <!-- book cover (open) -->
      <g transform="translate(256 256)">
        <!-- back cover shadow -->
        <path d="M-60 -40 L60 -40 L60 40 L-60 40 Z" fill="#2a4860" opacity="0.3" transform="translate(4 4)"/>
        <!-- pages -->
        <path d="M-55 -38 L0 -34 L0 34 L-55 38 Z" fill="url(#pages)" stroke="#c0c0a0" stroke-width="1.5"/>
        <path d="M55 -38 L0 -34 L0 34 L55 38 Z" fill="url(#pages)" stroke="#c0c0a0" stroke-width="1.5"/>
        <!-- page lines -->
        <line x1="-48" y1="-26" x2="-8" y2="-23" stroke="#b0b090" stroke-width="1.5"/>
        <line x1="-48" y1="-16" x2="-8" y2="-13" stroke="#b0b090" stroke-width="1.5"/>
        <line x1="-48" y1="-6" x2="-8" y2="-3" stroke="#b0b090" stroke-width="1.5"/>
        <line x1="-48" y1="4" x2="-8" y2="7" stroke="#b0b090" stroke-width="1.5"/>
        <line x1="-48" y1="14" x2="-8" y2="17" stroke="#b0b090" stroke-width="1.5"/>
        <line x1="8" y1="-23" x2="48" y2="-26" stroke="#b0b090" stroke-width="1.5"/>
        <line x1="8" y1="-13" x2="48" y2="-16" stroke="#b0b090" stroke-width="1.5"/>
        <line x1="8" y1="-3" x2="48" y2="-6" stroke="#b0b090" stroke-width="1.5"/>
        <line x1="8" y1="7" x2="48" y2="4" stroke="#b0b090" stroke-width="1.5"/>
        <line x1="8" y1="17" x2="48" y2="14" stroke="#b0b090" stroke-width="1.5"/>
        <!-- spine -->
        <line x1="0" y1="-34" x2="0" y2="34" stroke="#3a5880" stroke-width="2.5"/>
        <!-- floating orb above book -->
        <circle cx="0" cy="-70" r="16" fill="#8fc4f0" opacity="0.3"/>
        <circle cx="0" cy="-70" r="11" fill="#a0d8ff" opacity="0.6"/>
        <circle cx="-3" cy="-73" r="4" fill="#ffffff" opacity="0.5"/>
        <!-- rune on page -->
        <path d="M-32 0 L-24 -8 L-16 0 L-24 8 Z" fill="none" stroke="#5078a0" stroke-width="2" opacity="0.5"/>
        <circle cx="-24" cy="0" r="3" fill="#5078a0" opacity="0.4"/>
      </g>
      <!-- magic sparkles -->
      <g fill="#a0d8ff" opacity="0.4">
        <circle cx="180" cy="150" r="2"/>
        <circle cx="340" cy="180" r="1.5"/>
        <circle cx="200" cy="370" r="2"/>
        <circle cx="360" cy="350" r="1.5"/>
      </g>
    </g>
    <polygon points="256,28 484,256 256,484 28,256" fill="none" stroke="#a8d0ff" stroke-width="3" stroke-linejoin="round" opacity="0.8"/>
  </g>
</svg>
