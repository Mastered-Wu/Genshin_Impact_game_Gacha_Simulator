<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0bd"/><stop offset="40%" stop-color="#e3b35c"/><stop offset="78%" stop-color="#b5761f"/><stop offset="100%" stop-color="#8d5713"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#e0f8ff"/><stop offset="60%" stop-color="#80c8e0"/><stop offset="100%" stop-color="#3088a8"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a4a28"/><stop offset="50%" stop-color="#5a3a18"/><stop offset="100%" stop-color="#4a2a08"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a88a8"/><stop offset="50%" stop-color="#7ad0f0"/><stop offset="100%" stop-color="#4a88a8"/>
    </linearGradient>
    <clipPath id="diamond"><polygon points="256,36 476,256 256,476 36,256"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a2a38" flood-opacity="0.22"/></filter>
  </defs>
  <g filter="url(#sh)">
    <polygon points="256,28 484,256 256,484 28,256" fill="url(#rim)" stroke="#8a5a14" stroke-width="2"/>
    <g clip-path="url(#diamond)">
      <polygon points="256,36 476,256 256,476 36,256" fill="url(#bg)"/>
      <!-- water ripples -->
      <g fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-linecap="round">
        <path d="M120 160 Q160 150 200 160"/>
        <path d="M310 340 Q350 330 390 340"/>
      </g>
      <!-- polearm shaft (vertical) -->
      <rect x="248" y="140" width="16" height="310" rx="6" fill="url(#shaft)"/>
      <!-- gold bands -->
      <rect x="244" y="250" width="24" height="5" rx="2" fill="#c99438"/>
      <rect x="244" y="350" width="24" height="5" rx="2" fill="#c99438"/>
      <!-- spearhead (curved blade, glaive-like) -->
      <path d="M256 60 L300 100 L295 140 L256 155 L217 140 L212 100 Z" fill="url(#blade)" stroke="#3088a8" stroke-width="2" stroke-linejoin="round"/>
      <!-- blade edge curve (glaive hook) -->
      <path d="M295 140 Q310 120 300 100" fill="none" stroke="url(#blade)" stroke-width="6" stroke-linecap="round"/>
      <!-- center groove -->
      <path d="M256 65 L256 150" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
      <!-- edge highlight -->
      <path d="M256 60 L300 100" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
      <!-- socket where blade meets shaft -->
      <path d="M240 150 L272 150 L268 165 L244 165 Z" fill="#c99438" stroke="#8d5713" stroke-width="1.5"/>
      <!-- tassel -->
      <path d="M248 165 Q244 180 238 195" fill="none" stroke="#4a88a8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <path d="M264 165 Q268 180 274 195" fill="none" stroke="#4a88a8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
      <!-- pommel -->
      <circle cx="256" cy="458" r="12" fill="#c99438" stroke="#8d5713" stroke-width="2"/>
      <!-- tide orb at blade base -->
      <circle cx="256" cy="155" r="8" fill="#7ad0f0" opacity="0.5"/>
      <!-- sparkles -->
      <path d="M150 140 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#ffffff" opacity="0.75"/>
      <path d="M380 340 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#e0f8ff" opacity="0.65"/>
    </g>
    <polygon points="256,28 484,256 256,484 28,256" fill="none" stroke="#fbe9b2" stroke-width="3" stroke-linejoin="round" opacity="0.88"/>
  </g>
</svg>
