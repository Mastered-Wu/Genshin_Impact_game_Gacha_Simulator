<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d8ff"/><stop offset="40%" stop-color="#c89af0"/><stop offset="78%" stop-color="#7a3fb0"/><stop offset="100%" stop-color="#5a2a90"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#e0f8e8"/><stop offset="50%" stop-color="#90d8a8"/><stop offset="100%" stop-color="#48a868"/>
    </radialGradient>
    <linearGradient id="bust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a4c2a"/><stop offset="50%" stop-color="#2a6c42"/><stop offset="100%" stop-color="#3a8c58"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0e8b8"/><stop offset="100%" stop-color="#50a870"/>
    </linearGradient>
    <clipPath id="diamond"><polygon points="256,36 476,256 256,476 36,256"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a2a10" flood-opacity="0.24"/></filter>
  </defs>
  <g filter="url(#sh)">
    <polygon points="256,28 484,256 256,484 28,256" fill="url(#rim)" stroke="#5a2a90" stroke-width="2"/>
    <g clip-path="url(#diamond)">
      <polygon points="256,36 476,256 256,476 36,256" fill="url(#bg)"/>
      <!-- wind petals -->
      <g fill="#ffffff" opacity="0.18">
        <ellipse cx="120" cy="160" rx="10" ry="4" transform="rotate(-20 120 160)"/>
        <ellipse cx="390" cy="330" rx="8" ry="3" transform="rotate(30 390 330)"/>
        <ellipse cx="150" cy="350" rx="9" ry="3.5" transform="rotate(15 150 350)"/>
        <ellipse cx="400" cy="160" rx="7" ry="3" transform="rotate(-40 400 160)"/>
      </g>
      <!-- shoulders -->
      <path d="M150 380 Q150 300 200 270 L312 270 Q362 300 362 380 Z" fill="url(#bust)"/>
      <!-- collar (healer's wrap) -->
      <path d="M210 272 L256 296 L302 272" fill="none" stroke="#80d0a0" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M220 280 L256 300 L292 280" fill="none" stroke="#80d0a0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <!-- neck -->
      <rect x="240" y="240" width="32" height="40" rx="14" fill="url(#bust)"/>
      <!-- hair -->
      <path d="M180 225 Q172 162 215 128 Q256 105 297 128 Q340 162 332 225 Q324 252 306 244 L206 244 Q188 252 180 225 Z" fill="url(#hair)"/>
      <!-- face -->
      <ellipse cx="256" cy="195" rx="46" ry="52" fill="#e0f0d8"/>
      <!-- hair front (soft, parted) -->
      <path d="M210 172 Q204 140 238 124 Q256 115 274 124 Q308 140 302 172 Q296 158 282 153 Q268 149 256 152 Q244 149 230 153 Q216 158 210 172 Z" fill="url(#hair)"/>
      <!-- eyes (gentle) -->
      <path d="M228 200 Q236 206 244 200" fill="none" stroke="#1a4c2a" stroke-width="3" stroke-linecap="round"/>
      <path d="M268 200 Q276 206 284 200" fill="none" stroke="#1a4c2a" stroke-width="3" stroke-linecap="round"/>
      <!-- gentle smile -->
      <path d="M246 222 Q256 228 266 222" fill="none" stroke="#1a4c2a" stroke-width="2.5" stroke-linecap="round"/>
      <!-- leaf emblem -->
      <g transform="translate(256 358)">
        <path d="M0 -18 Q-12 -8 -8 8 Q0 18 8 8 Q12 -8 0 -18 Z" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M0 -14 L0 14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    <polygon points="256,28 484,256 256,484 28,256" fill="none" stroke="#e0c8ff" stroke-width="3" stroke-linejoin="round" opacity="0.85"/>
  </g>
</svg>
