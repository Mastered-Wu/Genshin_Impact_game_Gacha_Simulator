<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0e8ff"/><stop offset="40%" stop-color="#8fc4f0"/><stop offset="78%" stop-color="#3a6fb0"/><stop offset="100%" stop-color="#2a4a80"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#e8f0f8"/><stop offset="60%" stop-color="#a8c0d8"/><stop offset="100%" stop-color="#607890"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/><stop offset="50%" stop-color="#b0b0b0"/><stop offset="100%" stop-color="#787878"/>
    </linearGradient>
    <clipPath id="diamond"><polygon points="256,36 476,256 256,476 36,256"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1a1a28" flood-opacity="0.2"/></filter>
  </defs>
  <g filter="url(#sh)">
    <polygon points="256,28 484,256 256,484 28,256" fill="url(#rim)" stroke="#2a4a80" stroke-width="2"/>
    <g clip-path="url(#diamond)">
      <polygon points="256,36 476,256 256,476 36,256" fill="url(#bg)"/>
      <!-- plain training longsword -->
      <g transform="rotate(-30 256 256)">
        <!-- blade (plain, no decoration) -->
        <path d="M256 90 L270 90 L270 350 L256 365 L242 350 L242 90 Z" fill="url(#blade)" stroke="#787878" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M256 100 L256 358" stroke="#d0d0d0" stroke-width="2" opacity="0.5"/>
        <!-- simple crossguard -->
        <rect x="226" y="365" width="60" height="10" rx="2" fill="#484848" stroke="#383838" stroke-width="1"/>
        <!-- plain grip -->
        <rect x="248" y="375" width="16" height="44" rx="3" fill="#5a4030"/>
        <line x1="248" y1="384" x2="264" y2="384" stroke="#6a5040" stroke-width="1.5"/>
        <line x1="248" y1="394" x2="264" y2="394" stroke="#6a5040" stroke-width="1.5"/>
        <line x1="248" y1="404" x2="264" y2="404" stroke="#6a5040" stroke-width="1.5"/>
        <!-- simple pommel -->
        <circle cx="256" cy="425" r="8" fill="#484848" stroke="#383838" stroke-width="1"/>
      </g>
    </g>
    <polygon points="256,28 484,256 256,484 28,256" fill="none" stroke="#a8d0ff" stroke-width="3" stroke-linejoin="round" opacity="0.8"/>
  </g>
</svg>
