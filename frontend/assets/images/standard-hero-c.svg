<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0bd"/><stop offset="40%" stop-color="#e3b35c"/><stop offset="78%" stop-color="#b5761f"/><stop offset="100%" stop-color="#8d5713"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#f0f5e0"/><stop offset="50%" stop-color="#c8d8a0"/><stop offset="100%" stop-color="#789048"/>
    </radialGradient>
    <linearGradient id="bust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3c10"/><stop offset="50%" stop-color="#3a5c1a"/><stop offset="100%" stop-color="#52782a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8c878"/><stop offset="100%" stop-color="#608038"/>
    </linearGradient>
    <clipPath id="diamond"><polygon points="256,36 476,256 256,476 36,256"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1a2a06" flood-opacity="0.24"/></filter>
  </defs>
  <g filter="url(#sh)">
    <polygon points="256,28 484,256 256,484 28,256" fill="url(#rim)" stroke="#8a5a14" stroke-width="2"/>
    <g clip-path="url(#diamond)">
      <polygon points="256,36 476,256 256,476 36,256" fill="url(#bg)"/>
      <!-- leaf decorations -->
      <g fill="#ffffff" opacity="0.15">
        <ellipse cx="120" cy="170" rx="18" ry="8" transform="rotate(-30 120 170)"/>
        <ellipse cx="390" cy="330" rx="16" ry="7" transform="rotate(35 390 330)"/>
        <ellipse cx="150" cy="350" rx="14" ry="6" transform="rotate(20 150 350)"/>
      </g>
      <!-- shoulders (broader, guardian) -->
      <path d="M130 380 Q130 295 195 265 L317 265 Q382 295 382 380 Z" fill="url(#bust)"/>
      <!-- armor plates -->
      <path d="M170 310 Q256 290 342 310" fill="none" stroke="#7a9c3a" stroke-width="3" stroke-linecap="round"/>
      <path d="M195 335 Q256 320 317 335" fill="none" stroke="#7a9c3a" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
      <!-- neck -->
      <rect x="238" y="238" width="36" height="42" rx="16" fill="url(#bust)"/>
      <!-- hair -->
      <path d="M185 222 Q175 158 218 125 Q256 100 294 125 Q337 158 327 222 Q318 252 302 242 L210 242 Q194 252 185 222 Z" fill="url(#hair)"/>
      <!-- face -->
      <ellipse cx="256" cy="192" rx="50" ry="56" fill="#d8e8b0"/>
      <!-- hair front -->
      <path d="M206 170 Q198 134 235 118 Q256 108 277 118 Q314 134 306 170 Q300 155 284 150 Q270 146 256 149 Q242 146 228 150 Q212 155 206 170 Z" fill="url(#hair)"/>
      <!-- eyes -->
      <ellipse cx="234" cy="198" rx="5" ry="7" fill="#2a3c10"/>
      <ellipse cx="278" cy="198" rx="5" ry="7" fill="#2a3c10"/>
      <!-- determined brow -->
      <path d="M222 186 L246 190" stroke="#2a3c10" stroke-width="3" stroke-linecap="round"/>
      <path d="M266 190 L290 186" stroke="#2a3c10" stroke-width="3" stroke-linecap="round"/>
      <!-- shield emblem -->
      <g transform="translate(256 358)">
        <path d="M0 -20 L16 -14 L16 4 Q16 16 0 22 Q-16 16 -16 4 L-16 -14 Z" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
        <path d="M0 -10 L0 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M-10 0 L10 0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <path d="M155 135 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#ffffff" opacity="0.8"/>
      <path d="M375 335 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" fill="#f0f5e0" opacity="0.7"/>
    </g>
    <polygon points="256,28 484,256 256,484 28,256" fill="none" stroke="#fbe9b2" stroke-width="3" stroke-linejoin="round" opacity="0.88"/>
  </g>
</svg>
