<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d8ff"/><stop offset="40%" stop-color="#c89af0"/><stop offset="78%" stop-color="#7a3fb0"/><stop offset="100%" stop-color="#5a2a90"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#d8d0ff"/><stop offset="50%" stop-color="#9080d0"/><stop offset="100%" stop-color="#4a3a78"/>
    </radialGradient>
    <linearGradient id="bust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1040"/><stop offset="50%" stop-color="#2a1a58"/><stop offset="100%" stop-color="#3a2870"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6050a0"/><stop offset="100%" stop-color="#302060"/>
    </linearGradient>
    <clipPath id="diamond"><polygon points="256,36 476,256 256,476 36,256"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a0520" flood-opacity="0.24"/></filter>
  </defs>
  <g filter="url(#sh)">
    <polygon points="256,28 484,256 256,484 28,256" fill="url(#rim)" stroke="#5a2a90" stroke-width="2"/>
    <g clip-path="url(#diamond)">
      <polygon points="256,36 476,256 256,476 36,256" fill="url(#bg)"/>
      <!-- crescent moon -->
      <g transform="translate(130 140)" opacity="0.3">
        <path d="M0 0 a30 30 0 1 0 20 52 a24 24 0 1 1 -20 -52 z" fill="#e8d8ff"/>
      </g>
      <!-- stars -->
      <g fill="#e8d8ff" opacity="0.4">
        <circle cx="380" cy="130" r="2"/>
        <circle cx="400" cy="160" r="1.5"/>
        <circle cx="360" cy="170" r="1.5"/>
      </g>
      <!-- shoulders -->
      <path d="M150 380 Q150 300 200 270 L312 270 Q362 300 362 380 Z" fill="url(#bust)"/>
      <!-- hood/cloak -->
      <path d="M170 290 Q160 200 220 160 Q256 140 292 160 Q352 200 342 290 Q330 320 310 315 L202 315 Q182 320 170 290 Z" fill="url(#hair)" opacity="0.8"/>
      <!-- collar -->
      <path d="M210 272 L256 296 L302 272" fill="none" stroke="#a890e0" stroke-width="3.5" stroke-linecap="round"/>
      <!-- neck -->
      <rect x="240" y="240" width="32" height="40" rx="14" fill="url(#bust)"/>
      <!-- face -->
      <ellipse cx="256" cy="195" rx="44" ry="50" fill="#d0c8e8"/>
      <!-- hood front -->
      <path d="M200 170 Q192 135 228 118 Q256 108 284 118 Q320 135 312 170 Q306 152 290 148 Q274 144 256 147 Q238 144 222 148 Q206 152 200 170 Z" fill="url(#hair)"/>
      <!-- mask around eyes -->
      <path d="M214 192 L298 192 L298 210 L214 210 Z" fill="#1a1040" opacity="0.7" rx="4"/>
      <!-- eyes (sharper) -->
      <ellipse cx="236" cy="200" rx="4.5" ry="6" fill="#c8a0ff"/>
      <ellipse cx="276" cy="200" rx="4.5" ry="6" fill="#c8a0ff"/>
      <!-- bow emblem -->
      <g transform="translate(256 358)" fill="none" stroke="#e8d8ff" stroke-width="3" stroke-linecap="round">
        <path d="M-18 -16 Q-26 0 -18 16"/>
        <line x1="-18" y1="-16" x2="-18" y2="16"/>
        <path d="M-18 -16 Q0 -10 18 -16"/>
        <path d="M-18 16 Q0 10 18 16"/>
        <path d="M18 -16 Q26 0 18 16"/>
      </g>
    </g>
    <polygon points="256,28 484,256 256,484 28,256" fill="none" stroke="#e0c8ff" stroke-width="3" stroke-linejoin="round" opacity="0.85"/>
  </g>
</svg>
