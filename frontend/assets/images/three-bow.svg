<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0e8ff"/><stop offset="40%" stop-color="#8fc4f0"/><stop offset="78%" stop-color="#3a6fb0"/><stop offset="100%" stop-color="#2a4a80"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#f0f0e0"/><stop offset="60%" stop-color="#c0c098"/><stop offset="100%" stop-color="#787858"/>
    </radialGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a5828"/><stop offset="50%" stop-color="#a07838"/><stop offset="100%" stop-color="#7a5828"/>
    </linearGradient>
    <clipPath id="diamond"><polygon points="256,36 476,256 256,476 36,256"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2a2008" flood-opacity="0.2"/></filter>
  </defs>
  <g filter="url(#sh)">
    <polygon points="256,28 484,256 256,484 28,256" fill="url(#rim)" stroke="#2a4a80" stroke-width="2"/>
    <g clip-path="url(#diamond)">
      <polygon points="256,36 476,256 256,476 36,256" fill="url(#bg)"/>
      <!-- simple wooden bow -->
      <path d="M256 80 Q180 200 200 256 Q180 312 256 432" fill="none" stroke="url(#wood)" stroke-width="12" stroke-linecap="round"/>
      <!-- weathered marks -->
      <path d="M248 120 Q210 200 210 256" fill="none" stroke="#5a3818" stroke-width="2" opacity="0.5" stroke-dasharray="4 3"/>
      <path d="M248 392 Q210 312 210 256" fill="none" stroke="#5a3818" stroke-width="2" opacity="0.5" stroke-dasharray="4 3"/>
      <!-- grip wrap (leather) -->
      <rect x="200" y="236" width="14" height="40" rx="2" fill="#4a3018"/>
      <line x1="200" y1="244" x2="214" y2="244" stroke="#3a2008" stroke-width="1.5"/>
      <line x1="200" y1="254" x2="214" y2="254" stroke="#3a2008" stroke-width="1.5"/>
      <line x1="200" y1="264" x2="214" y2="264" stroke="#3a2008" stroke-width="1.5"/>
      <!-- string -->
      <line x1="248" y1="84" x2="210" y2="256" stroke="#d0d0c0" stroke-width="2" opacity="0.7"/>
      <line x1="210" y1="256" x2="248" y2="428" stroke="#d0d0c0" stroke-width="2" opacity="0.7"/>
      <!-- arrow -->
      <line x1="210" y1="256" x2="300" y2="256" stroke="#a07838" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M300 250 L312 256 L300 262" fill="none" stroke="#a07838" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- fletching -->
      <path d="M210 256 L200 250 L195 254 L200 256 L195 258 L200 262 Z" fill="#7a5828" opacity="0.6"/>
    </g>
    <polygon points="256,28 484,256 256,484 28,256" fill="none" stroke="#a8d0ff" stroke-width="3" stroke-linejoin="round" opacity="0.8"/>
  </g>
</svg>
